# Daily arXiv digests -- read by backend/app/daily_digest.py, which
# .github/workflows/daily-digest.yml runs every day on GitHub's servers.
# Edit this file on GitHub to change topics; the next run picks it up.
#
# Each [[feed]] becomes one report (Markdown + PDF in digests/reports/) and
# remembers its own covered papers in digests/seen.json, so nothing repeats.
#
#   keywords       phrases searched in title/abstract/etc., OR'd together
#   categories     arXiv categories (https://arxiv.org/category_taxonomy), OR'd
#                  together; AND'ed with keywords when both are given
#   topic          one sentence on what you care about. Papers are ranked by
#                  how close their abstract is to it (keywords if no topic),
#                  and the best max_papers are summarised.
#   days           only papers SUBMITTED in the last N days. A paper only shows
#                  up once arXiv announces it, which is 1-4 days after
#                  submission (Thursday-afternoon to Friday submissions are
#                  announced Sunday night), so keep this >= 5 -- with 3, Monday's
#                  run never sees that batch. seen.json stops the overlap from
#                  repeating anything.
#   max_papers     papers per report (1-8). Each one is summarised on its own,
#                  so more papers = a longer run, not shallower summaries.
#   max_results    how many of the newest matches to rank (1-100)
#   min_relevance  skip papers scoring below this (0-1; default 0.20). On-topic
#                  papers typically score 0.35-0.6. The scores are in the run log.
#   instructions   how to summarise each paper (default: TL;DR, problem,
#                  method, key results with numbers, limitations)

# Send an email even on days when no feed found anything new.
email_when_nothing_new = false

[defaults]
days = 7
max_papers = 5
max_results = 50

[[feed]]
name = "rag"
keywords = ["retrieval augmented generation", "retrieval-augmented"]
categories = ["cs.CL", "cs.IR", "cs.AI"]
topic = "Retrieval-augmented generation: retrieval quality, grounding and faithfulness, evaluation benchmarks, and RAG system design."

